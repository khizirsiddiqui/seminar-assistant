<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Seminar Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
  <style>
    /* Layout concept: a syllabus. Sessions read as a dated timeline; preparation reads as annotated notes. */
    :root {
      --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5; --rule:#d9dee6;
      --ink:#14202b; --ink-2:#5a6877;
      --accent:#0f5f63; --accent-hover:#0b4a4d; --accent-soft:#dff0f0; --on-accent:#ffffff;
      --ok:#17703f; --ok-soft:#dcf1e3;
      --warn:#8a5a00; --warn-soft:#fbefd2;
      --bad:#b3261e; --bad-hover:#8f1d17; --bad-soft:#fbe4e2;
      --focus:0 0 0 3px rgba(15,95,99,.35);
      --font-display:"Newsreader", Georgia, "Times New Roman", serif;
      --font-body:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --r-sm:6px; --r:10px;
      --s1:.25rem; --s2:.5rem; --s3:.75rem; --s4:1rem; --s5:1.5rem; --s6:2.25rem; --s7:3.5rem;
      --text-sm:.85rem; --text-base:1rem; --text-lg:1.2rem; --text-xl:1.75rem; --text-2xl:2.4rem;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:#0d141b; --surface:#141d26; --surface-2:#1a2530; --rule:#2a3846;
        --ink:#e6ecf2; --ink-2:#9aa9b8;
        --accent:#58c4c4; --accent-hover:#7fd6d6; --accent-soft:rgba(88,196,196,.14); --on-accent:#06191a;
        --ok:#6fd49a; --ok-soft:rgba(111,212,154,.14);
        --warn:#f0c15a; --warn-soft:rgba(240,193,90,.14);
        --bad:#f28b82; --bad-hover:#f6a8a1; --bad-soft:rgba(242,139,130,.14);
        --focus:0 0 0 3px rgba(88,196,196,.4);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg:#0d141b; --surface:#141d26; --surface-2:#1a2530; --rule:#2a3846;
      --ink:#e6ecf2; --ink-2:#9aa9b8;
      --accent:#58c4c4; --accent-hover:#7fd6d6; --accent-soft:rgba(88,196,196,.14); --on-accent:#06191a;
      --ok:#6fd49a; --ok-soft:rgba(111,212,154,.14);
      --warn:#f0c15a; --warn-soft:rgba(240,193,90,.14);
      --bad:#f28b82; --bad-hover:#f6a8a1; --bad-soft:rgba(242,139,130,.14);
      --focus:0 0 0 3px rgba(88,196,196,.4);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body); font-size: var(--text-base); line-height: 1.55;
      background: var(--bg); color: var(--ink);
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    main {
      flex: 1; width: 100%; max-width: 1040px; margin: 0 auto;
      padding-block: var(--s6) var(--s7);
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    a { color: var(--accent); text-underline-offset: 2px; }
    a:hover { color: var(--accent-hover); }
    code, .mono { font-family: var(--font-mono); font-size: .88em; font-variant-numeric: tabular-nums; }
    code { background: var(--surface-2); padding: .1rem .35rem; border-radius: 4px; overflow-wrap: anywhere; }

    /* Accessibility helpers */
    .skip-link { position: absolute; left: -9999px; top: 0; background: var(--accent); color: var(--on-accent); padding: var(--s2) var(--s4); border-radius: var(--r-sm); z-index: 100; }
    .skip-link:focus { left: var(--s4); top: var(--s4); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Header */
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 21; }
    header.site { background: var(--surface); border-bottom: 1px solid var(--rule); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
    .site-inner {
      max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: var(--s5); flex-wrap: wrap;
      padding-block: var(--s3);
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    .brand { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; color: var(--ink); text-decoration: none; letter-spacing: -.01em; display: inline-flex; align-items: baseline; gap: .35rem; }
    .brand { align-items: center; }
    .brand-mark { width: 1.35rem; height: 1.35rem; color: var(--accent); }
    .brand:hover { color: var(--ink); }
    nav.main-nav { display: flex; gap: var(--s4); margin-left: auto; }
    .theme-toggle { background: transparent; color: var(--ink-2); border: 1px solid var(--rule); border-radius: var(--r-sm); width: 2.1rem; height: 2.1rem; padding: 0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .theme-toggle:hover { background: var(--surface-2); color: var(--ink); }
    .theme-toggle svg { width: 1.05rem; height: 1.05rem; }
    nav.main-nav a { color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: .93rem; padding: var(--s1) 0; border-bottom: 2px solid transparent; }
    nav.main-nav a:hover { color: var(--ink); }
    nav.main-nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

    /* Typography */
    h1, h2, h3 { font-family: var(--font-display); font-weight: 500; text-wrap: balance; letter-spacing: -.015em; line-height: 1.2; margin: 0; }
    h1 { font-size: var(--text-2xl); }
    h2 { font-size: var(--text-xl); }
    h3 { font-size: var(--text-lg); font-weight: 600; }
    p { margin: 0 0 var(--s3); }
    p:last-child { margin-bottom: 0; }
    .muted { color: var(--ink-2); font-size: .93rem; }
    .eyebrow { font-family: var(--font-mono); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin: 0 0 var(--s2); }
    .page-head { margin-bottom: var(--s6); max-width: 65ch; display: flex; flex-direction: column; gap: var(--s2); }
    .page-head p { margin: 0; }
    .paper-title { font-family: var(--font-display); font-size: var(--text-xl); font-weight: 500; margin: 0; }

    /* Panels: borders only on primary containers */
    .card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s5); margin-bottom: var(--s4); }
    .card-title { font-family: var(--font-body); font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); margin: 0 0 var(--s3); display: flex; align-items: center; gap: var(--s2); }
    .step-num { display: inline-flex; align-items: center; justify-content: center; width: 1.45rem; height: 1.45rem; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: .78rem; font-weight: 600; letter-spacing: 0; flex-shrink: 0; }

    /* Buttons */
    .button, button.button, button[type="submit"] {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
      background: var(--accent); color: var(--on-accent); border: 1px solid transparent;
      padding: .6rem 1.15rem; border-radius: var(--r-sm); cursor: pointer;
      font: 600 .93rem/1.3 var(--font-body); text-decoration: none; transition: background .15s, border-color .15s;
    }
    .button:hover, button.button:hover, button[type="submit"]:hover { background: var(--accent-hover); color: var(--on-accent); }
    .button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: none; box-shadow: var(--focus); }
    .button.secondary, button.secondary { background: transparent; color: var(--ink); border-color: var(--rule); }
    .button.secondary:hover, button.secondary:hover { background: var(--surface-2); color: var(--ink); }
    .button.danger, button.danger { background: transparent; color: var(--bad); border-color: var(--rule); }
    .button.danger:hover, button.danger:hover { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
    .button.success, button.success { background: var(--ok); color: #fff; }
    .button.success:hover, button.success:hover { background: var(--ok); filter: brightness(.92); color: #fff; }
    .button.small, button.small { padding: .3rem .7rem; font-size: .83rem; }
    .button[disabled], button[disabled] { opacity: .55; cursor: not-allowed; }
    .button svg, button svg { width: 1em; height: 1em; flex-shrink: 0; }

    /* Forms */
    label { display: block; margin: var(--s4) 0 var(--s1); font-weight: 600; font-size: .9rem; }
    .card > label:first-of-type, .card > .card-title + label { margin-top: 0; }
    input[type=text], input[type=number], input[type=time], textarea, select {
      width: 100%; padding: .6rem .75rem; font: inherit; font-size: .95rem;
      border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--bg); color: var(--ink);
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; }
    textarea.mono { font-family: var(--font-mono); font-size: .85rem; }
    .field-hint { color: var(--ink-2); font-size: var(--text-sm); margin: var(--s1) 0 0; }
    .form-row { display: flex; gap: var(--s4); flex-wrap: wrap; }
    .form-row > div { flex: 1; min-width: 140px; }
    input[type=checkbox] { width: 1.05rem; height: 1.05rem; accent-color: var(--accent); cursor: pointer; }

    /* Drop zone (wraps the native file input) */
    .dropzone { position: relative; border: 1.5px dashed var(--rule); border-radius: var(--r); background: var(--bg); padding: var(--s5) var(--s4); text-align: center; transition: border-color .15s, background .15s; }
    .dropzone:hover, .dropzone.dragover, .dropzone:focus-within { border-color: var(--accent); background: var(--accent-soft); }
    .dropzone input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .dropzone svg { width: 1.6rem; height: 1.6rem; color: var(--accent); margin-bottom: var(--s2); }
    .dropzone .dz-title { font-weight: 600; margin: 0; }
    .dropzone .dz-name { font-family: var(--font-mono); font-size: .85rem; color: var(--accent); margin-top: var(--s1); overflow-wrap: anywhere; }

    /* Tables (confirm page) */
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: .93rem; }
    th, td { padding: var(--s3); text-align: left; vertical-align: top; }
    thead th { font-size: .75rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); font-weight: 600; border-bottom: 1px solid var(--rule); }
    tbody tr { border-bottom: 1px solid var(--rule); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface-2); }
    td.actions { text-align: right; white-space: nowrap; }
    td.date-cell { font-family: var(--font-mono); font-size: .85rem; white-space: nowrap; }
    td.paper-cell { font-family: var(--font-display); font-size: 1.05rem; }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: .35rem; padding: .1rem .6rem; border-radius: 999px; font-size: .75rem; font-weight: 600; line-height: 1.6; white-space: nowrap; }
    .badge::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: currentColor; }
    .badge.success, .badge--success { background: var(--ok-soft); color: var(--ok); }
    .badge.muted, .badge--muted { background: var(--warn-soft); color: var(--warn); }

    /* Alerts */
    .error { color: var(--bad); }
    .alert-error, .alert-info { border-radius: var(--r-sm); padding: var(--s3) var(--s4); margin: var(--s4) 0; text-align: left; }
    .alert-error { background: var(--bad-soft); border: 1px solid var(--bad); color: var(--bad); }
    .alert-error p { margin: 0; }
    .alert-info { background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent); }

    /* Progress + spinner (JS-driven: keep class names and width behavior) */
    .progress-container { display: none; margin-top: var(--s4); }
    .progress-container.visible { display: block; }
    .progress-bar-track { background: var(--rule); border-radius: 999px; height: 6px; width: 100%; overflow: hidden; }
    .progress-bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width .2s; border-radius: 999px; }
    .progress-label { font-size: .9rem; color: var(--ink-2); margin-top: var(--s2); }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2.5px solid var(--rule); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Utilities */
    .detail-grid { display: grid; grid-template-columns: auto 1fr; gap: var(--s2) var(--s4); margin: 0; font-size: .92rem; }
    .detail-grid dt, .detail-grid dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .narrow-card { max-width: 640px; }
    .center-card { max-width: 560px; margin: var(--s6) auto; }
    .inline-form { display: inline; margin: 0; }
    .row-actions { display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; margin-top: var(--s4); }
    .back-link { display: inline-block; margin-top: var(--s5); color: var(--ink-2); text-decoration: none; font-size: .9rem; }
    .back-link:hover { color: var(--ink); }
    .empty-state { padding: var(--s6) 0; max-width: 52ch; }
    .empty-state h2 { margin-bottom: var(--s3); }
    .empty-state .row-actions { margin-top: var(--s4); }
    .stage-line { display: flex; gap: var(--s4); flex-wrap: wrap; margin: 0 0 var(--s5); padding: 0; list-style: none; font-size: .85rem; color: var(--ink-2); }
    .stage-line li { display: inline-flex; align-items: center; gap: var(--s2); }
    .stage-line li.done { color: var(--ok); }
    .stage-line li.current { color: var(--ink); font-weight: 600; }
    .stage-line li + li::before { content: ""; width: 1.4rem; height: 1px; background: var(--rule); margin-right: var(--s2); }
    .stage-line svg { width: .95rem; height: .95rem; }
    /* Summary strip, meter, extra badges */
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; margin: 0 0 var(--s5); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); }
    .fact { padding: var(--s3) var(--s4); min-width: 0; }
    .fact + .fact { border-left: 1px solid var(--rule); }
    .fact dt { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); font-weight: 600; margin: 0 0 2px; }
    .fact dd { margin: 0; font-family: var(--font-display); font-size: 1.3rem; line-height: 1.25; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    .fact dd small { font: .85rem var(--font-body); color: var(--ink-2); }
    @media (max-width: 600px) { .fact:nth-child(odd) { border-left: none; } .fact:nth-child(n+3) { border-top: 1px solid var(--rule); } }
    .meter { height: 5px; border-radius: 999px; background: var(--rule); overflow: hidden; }
    .meter > span { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
    .badge.info, .badge--info { background: var(--accent-soft); color: var(--accent); }
    .badge.plain { background: var(--surface-2); color: var(--ink-2); }

    /* Selectable talk list (confirm) */
    .pick-list { margin: 0; padding: 0; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--bg); }
    .pick-head, .pick { display: grid; grid-template-columns: auto 7.5rem minmax(0, 1fr); gap: var(--s3); align-items: start; padding: var(--s3) var(--s4); }
    .pick-head { align-items: center; border-bottom: 1px solid var(--rule); font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); font-weight: 600; }
    .pick + .pick { border-top: 1px solid var(--rule); }
    .pick label { margin: 0; font-weight: inherit; font-size: inherit; cursor: pointer; }
    .pick-rows { list-style: none; margin: 0; padding: 0; }
    .pick:has(input:checked) { background: var(--surface); }
    .pick:not(:has(input:checked)) .pick-body { opacity: .5; }
    .pick-date { font-family: var(--font-mono); font-size: .85rem; color: var(--accent); padding-top: .15rem; }
    .pick-body { min-width: 0; }
    .pick-paper { font-family: var(--font-display); font-size: 1.1rem; line-height: 1.3; display: block; overflow-wrap: anywhere; }
    .pick-who { color: var(--ink-2); font-size: .88rem; display: block; margin-top: 2px; }
    .pick input[type=checkbox] { margin-top: .3rem; }
    @media (max-width: 600px) {
      .pick-head, .pick { grid-template-columns: auto minmax(0, 1fr); }
      .pick-head .ph-date, .pick-date { grid-column: 2; }
      .pick-body { grid-column: 2; }
      .pick-head .ph-paper { display: none; }
    }

    footer.site { text-align: center; color: var(--ink-2); font-family: var(--font-mono); font-size: .75rem; padding: var(--s4); border-top: 1px solid var(--rule); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.9rem; }
      main { padding-block: var(--s5) var(--s6); }
      .card { padding: var(--s4); }
      .form-row { flex-direction: column; }
      .site-inner { gap: var(--s3); }
      nav.main-nav { margin-left: auto; gap: var(--s3); }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site">
    <div class="site-inner">
      <a class="brand" href="/"><svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M8 3v4m8-4v4M3.5 10h17"/><path d="m9 15 2 2 4-4"/></svg>Seminar Assistant</a>
      <nav class="main-nav" aria-label="Main">
        <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>New schedule</a>
        <a href="/history" {% if request.url.path == "/history" %}aria-current="page"{% endif %}>History</a>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch colour theme" title="Switch colour theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>
  <main id="main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="site">Seminar Assistant</footer>
  <script>
    (function () {
      var root = document.documentElement, btn = document.getElementById("theme-toggle");
      try { var t = localStorage.getItem("sg-theme"); if (t) root.setAttribute("data-theme", t); } catch (e) {}
      btn.addEventListener("click", function () {
        var dark = root.getAttribute("data-theme") === "dark" ||
          (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
        var next = dark ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("sg-theme", next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
