<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seminar Guide</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #e4e7ec;
      --text: #1a2233;
      --text-muted: #667085;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #b91c1c;
      --danger-hover: #991b1b;
      --success: #15803d;
      --success-bg: #ecfdf5;
      --focus-ring: 0 0 0 3px rgba(37, 99, 235, 0.15);
      --radius: 10px;
      --radius-sm: 6px;
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
      --space-4: 1rem; --space-5: 1.5rem; --space-6: 2rem;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
      --shadow-lg: 0 4px 12px rgba(16, 24, 40, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      line-height: 1.5;
    }
    main { flex: 1; width: 100%; max-width: 860px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-6); }

    /* Header / nav */
    header.site {
      background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .site-inner { max-width: 860px; margin: 0 auto; padding: var(--space-3) var(--space-4); display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap; }
    .brand { font-size: 1.15rem; font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: -0.01em; }
    .brand span { color: var(--primary); }
    nav.main-nav { display: flex; gap: var(--space-1); }
    nav.main-nav a {
      color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.95rem;
      padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); transition: background .15s, color .15s;
    }
    nav.main-nav a:hover { background: var(--bg); color: var(--text); }
    nav.main-nav a.active { background: rgba(37, 99, 235, 0.08); color: var(--primary); }

    /* Typography */
    h1 { font-size: 1.6rem; letter-spacing: -0.02em; margin: 0 0 var(--space-2); }
    h2 { font-size: 1.35rem; letter-spacing: -0.01em; margin: 0 0 var(--space-2); }
    h3 { font-size: 1.05rem; margin: var(--space-5) 0 var(--space-3); }
    p { margin: 0 0 var(--space-3); }
    p:last-child { margin-bottom: 0; }
    .muted { color: var(--text-muted); font-size: 0.92rem; }
    a { color: var(--primary); }

    /* Page header pattern */
    .page-head { margin-bottom: var(--space-5); }
    .page-head p { margin: 0; }

    /* Cards */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: var(--space-5); margin-bottom: var(--space-4);
    }
    .card-title { font-size: 1rem; font-weight: 600; margin: 0 0 var(--space-1); display: flex; align-items: center; gap: var(--space-2); }
    .step-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.5rem; height: 1.5rem; border-radius: 50%;
      background: var(--primary); color: #fff; font-size: 0.85rem; font-weight: 700; flex-shrink: 0;
    }

    /* Buttons */
    .button, button.button, button[type="submit"] {
      display: inline-block; background: var(--primary); color: #fff;
      border: none; padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-sm); cursor: pointer;
      font-size: 0.95rem; font-weight: 600; text-decoration: none;
      transition: background .15s, box-shadow .15s; line-height: 1.3;
    }
    .button:hover, button.button:hover { background: var(--primary-hover); }
    .button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: none; box-shadow: var(--focus-ring);
    }
    .button.secondary, button.secondary {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
    }
    .button.secondary:hover, button.secondary:hover { background: var(--bg); }
    .button.danger, button.danger {
      background: var(--danger); color: #fff; border: none;
      padding: var(--space-2) var(--space-4); font-size: 0.9rem;
    }
    .button.danger:hover, button.danger:hover { background: var(--danger-hover); }
    .button.success { background: var(--success); }
    .button.success:hover { background: #166534; }
    .button.small, button.small { padding: var(--space-1) var(--space-3); font-size: 0.85rem; }
    .button[disabled], button[disabled] { opacity: 0.6; cursor: not-allowed; }

    /* Forms */
    label { display: block; margin: var(--space-4) 0 var(--space-1); font-weight: 600; font-size: 0.92rem; }
    .card label:first-of-type { margin-top: var(--space-3); }
    input[type=text], input[type=number], input[type=time], textarea, select {
      width: 100%; padding: var(--space-3); font-size: 0.95rem; font-family: inherit;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text);
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; }
    .field-hint { color: var(--text-muted); font-size: 0.85rem; margin: var(--space-1) 0 0; }
    .form-row { display: flex; gap: var(--space-4); flex-wrap: wrap; }
    .form-row > div { flex: 1; min-width: 140px; }
    .form-row label { margin-top: var(--space-4); }
    input[type=file] {
      font-size: 0.9rem; width: 100%; padding: var(--space-3);
      border: 1px dashed var(--border); border-radius: var(--radius-sm); background: var(--bg);
    }

    /* Tables */
    table {
      border-collapse: collapse; width: 100%; margin: var(--space-3) 0;
      font-size: 0.93rem;
    }
    th, td { border: none; padding: var(--space-3) var(--space-3); text-align: left; vertical-align: middle; }
    thead th {
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border);
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg); }
    td.actions { text-align: right; white-space: nowrap; }

    /* Badges */
    .badge {
      display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px;
      font-size: 0.78rem; font-weight: 600; line-height: 1.5;
    }
    .badge.success, .badge--success { background: var(--success-bg); color: var(--success); }
    .badge.muted, .badge--muted { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }

    /* Empty state */
    .empty-state {
      text-align: center; padding: var(--space-6) var(--space-4); color: var(--text-muted);
    }
    .empty-state .icon { font-size: 2rem; margin-bottom: var(--space-2); }

    /* Error alert */
    .error { color: var(--danger); }
    .alert-error {
      background: #fef2f2; border: 1px solid #fecaca; color: var(--danger);
      border-radius: var(--radius-sm); padding: var(--space-4); margin: var(--space-4) 0;
    }

    /* Progress + spinner (JS-driven: keep class names and width behavior) */
    .progress-container { display: none; margin-top: var(--space-4); }
    .progress-container.visible { display: block; }
    .progress-bar-track { background: var(--border); border-radius: 999px; height: 8px; width: 100%; max-width: 480px; overflow: hidden; }
    .progress-bar-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.2s; border-radius: 999px; }
    .progress-label { font-size: 0.9rem; color: var(--text-muted); margin-top: var(--space-2); }
    .spinner {
      display: inline-block; width: 18px; height: 18px; border: 3px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin 0.8s linear infinite; vertical-align: -4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Misc */
    .stack { display: flex; flex-direction: column; gap: var(--space-3); }
    .row-actions { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; margin-top: var(--space-4); }
    .back-link { display: inline-block; margin-top: var(--space-4); color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { color: var(--text); }
    footer.site { text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: var(--space-4); }

    @media (max-width: 480px) {
      main { padding: var(--space-4) var(--space-3); }
      .card { padding: var(--space-4); }
      .form-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="site">
    <div class="site-inner">
      <a class="brand" href="/">Seminar<span>Guide</span></a>
      <nav class="main-nav">
        <a href="/">New schedule</a>
        <a href="/history">History</a>
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site">Seminar Guide · University of Tübingen</footer>
</body>
</html>
