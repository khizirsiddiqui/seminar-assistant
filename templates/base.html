<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Seminar Guide</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 a { color: #222; text-decoration: none; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ccc; padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #f5f5f5; }
    label { display: block; margin: 0.75rem 0 0.25rem; font-weight: 600; }
    input[type=text], input[type=number], input[type=time], textarea {
      width: 100%; max-width: 480px; padding: 0.4rem; box-sizing: border-box; }
    button, .button { background: #2563eb; color: #fff; border: none; padding: 0.5rem 1rem;
      border-radius: 4px; cursor: pointer; font-size: 1rem; margin-top: 1rem; display: inline-block;
      text-decoration: none; }
    .error { color: #b91c1c; }
    nav { margin-bottom: 1.5rem; }
    nav a { margin-right: 1rem; }
    .progress-container { display: none; margin-top: 1rem; }
    .progress-container.visible { display: block; }
    .progress-bar-track { background: #e5e7eb; border-radius: 4px; height: 10px; width: 100%; max-width: 480px; overflow: hidden; }
    .progress-bar-fill { background: #2563eb; height: 100%; width: 0%; transition: width 0.2s; }
    .progress-label { font-size: 0.9rem; color: #555; margin-top: 0.4rem; }
    .spinner { display: inline-block; width: 22px; height: 22px; border: 3px solid #e5e7eb;
      border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; }
    .danger, button.danger { background: #b91c1c; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1><a href="/">Seminar Guide</a></h1>
  <nav>
    <a href="/">New schedule</a>
    <a href="/history">History</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
